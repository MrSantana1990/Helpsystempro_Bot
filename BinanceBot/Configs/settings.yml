testnet: true
horarios_estrategicos:
- - 9
  - 12
- - 23
  - 2
intervalo_execucao: 30
intervalo_pausa: 300
rsi_periodo: 14
rsi_compra: 30
rsi_venda: 70
stop_loss_percentual: 2
take_profit_percentual: 5
minimo_usdt_por_ordem: 5
maximo_exposicao_por_ordem: 0.25
moedas_monitoradas:
- BTCUSDT
- ETHUSDT
- XRPUSDT
- BNBUSDT
- DOGEUSDT
- SOLUSDT
logs:
  nivel: INFO
  rotacao_diaria: true
  backup_logs: 7
limite_notificacoes_por_minuto: 10
monitoramento_ativo: true
quantidade_minima_trade: 0.001
quantidade_maxima_trade: 0.5
ia_ativa: true
ia_modelo: baseline
alerta_critico_ativo: true
alerta_critico_destinatarios:
- thiago
- rodolfo
idioma_interface: pt-br
formato_data: '%d/%m/%Y %H:%M:%S'
max_moedas_por_ciclo: 3
max_open_positions: 3
buy_threshold: 0.45
avoid_threshold: -0.2

# ----------------- Risco (Local-first) -----------------
# Para LIVE (testnet=false), limites são obrigatórios.
risk_max_daily_buy_quote_usdt: 50
risk_max_daily_loss_usdt: 5
risk_max_orders_per_day: 12
risk_max_exposure_quote_usdt_per_symbol: 25
risk_max_drawdown_usdt: 0
weights:
  rsi: 0.45
  bollinger: 0.3
  macd: 0.15
  sentiment: 0.1

# ----------------- Decision Engine 2.0 -----------------
decision_v2_weights:
  technical: 0.35
  sentiment: 0.2
  event: 0.2
  regime: 0.15
  liquidity: 0.1

regime_volatility_target_1h: 0.018
position_size_min_multiplier: 0.25
position_size_max_multiplier: 1.5

event_news_max_items: 20
event_news_weight: 0.5
event_market_weight: 0.3
event_sentiment_weight: 0.2
event_bus_history_limit: 500
news_term: crypto
db_path: data/trading.sqlite3

# ----------------- Discovery (novas moedas) -----------------
# O bot pode "explorar" oportunidades fora de moedas_monitoradas.
# Importante: ele NÃO compra moedas novas sem aprovação do usuário no painel.
discovery_enabled: true
discovery_limit: 20
discovery_min_quote_volume: 5000000
discovery_min_score: 0.55
discovery_max_new_per_day: 3
discovery_cooldown_hours: 24
discovery_exclude_bases: []
